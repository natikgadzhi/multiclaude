# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - binary: multiclaude
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/natikgadzhi/multiclaude/cmd.buildVersion={{.Version}}
      - -X github.com/natikgadzhi/multiclaude/cmd.buildCommit={{.Commit}}
      - -X github.com/natikgadzhi/multiclaude/cmd.buildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: natikgadzhi
      name: homebrew-taps
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/natikgadzhi/multiclaude"
    description: "Switch between Claude Code accounts with named profiles"
    license: "MIT"
    test: |
      system "#{bin}/multiclaude", "--help"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
